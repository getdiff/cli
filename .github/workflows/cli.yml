name: CLI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Read version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag and trigger release
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh api repos/${{ github.repository }}/git/refs/tags/${TAG} >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, skipping"
          else
            git tag ${TAG}
            git push origin ${TAG}
            echo "Created tag ${TAG}"
            # Tags pushed by Actions don't trigger other workflows,
            # so explicitly dispatch the release workflow
            gh workflow run release-cli.yml -f tag=${TAG}
            echo "Dispatched release workflow for ${TAG}"
          fi
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
