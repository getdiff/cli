[package]
name = "getdiff-gateway"
version = "0.1.9"
edition = "2024"
description = "Agent capability gateway - policy enforcement and credential injection at the network boundary"
license = "Apache-2.0"
repository = "https://github.com/getdiff/cli"

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_urlencoded = "0.7"

# HTTP server (proxy)
axum = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tower-service = "0.3"

# HTTP client (upstream forwarding + event shipping)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Crypto
sha2 = "0.10"
base64 = "0.22"
getdiff-envelope = { path = "../envelope", version = "0.1.0" }

# System
dirs = "6"
uuid = { version = "1", features = ["v4"] }
gethostname = "1"
anyhow = "1"

# Linux-only: SO_ORIGINAL_DST
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio-test = "0.4"
bytes = "1"
